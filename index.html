<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Don't Wait, Do, Mate - 기부 가이드</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link href="https://cdn.jsdelivr.net/npm/pretendard@latest/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root {
  --charcoal: #292524; --stone: #57534E; --coral: #E07A5F;
  --sand: #F2CC8F; --cream: #FAF5F0; --white: #FFFFFF;
  --sage: #81B29A; --muted-red: #C05D3F; --warm-gray: #A8A29E;
  --bg: var(--cream); --text: var(--charcoal); --card: var(--white);
}
* { margin:0; padding:0; box-sizing:border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg); color: var(--text);
  line-height: 1.5; font-feature-settings: 'tnum';
  display: flex; flex-direction: column;
}
input, select, button { font-family: inherit; }

/* === LAYOUT === */
.app-shell { display:flex; flex-direction:column; height:100%; max-width:440px; margin:0 auto; width:100%; }
.top-bar {
  background: var(--charcoal); padding: 14px 20px; display: flex;
  justify-content: space-between; align-items: center; flex-shrink: 0;
}
.logo { color: #fff; font-weight: 800; font-size: 1rem; letter-spacing: -0.3px; }
.logo span { color: var(--coral); }
.content-area { flex: 1; overflow-y: auto; padding: 12px 16px 16px; -webkit-overflow-scrolling: touch; }
.bottom-bar {
  display: flex; background: var(--white); border-top: 1px solid #E8E0D8;
  flex-shrink: 0; padding: 6px 0 env(safe-area-inset-bottom, 8px);
}
.bottom-tab {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 8px 0; cursor: pointer; border: none; background: none;
  color: var(--warm-gray); font-size: 0.65rem; font-weight: 600;
  transition: color 0.2s; -webkit-tap-highlight-color: transparent;
}
.bottom-tab.active { color: var(--coral); }
.bottom-tab svg { width: 22px; height: 22px; }

/* === SCREENS === */
.screen { display: none; }
.screen.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

/* === HOME SCREEN === */
.home-container {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 70vh; padding: 20px;
}
.home-brand {
  font-size: 1.5rem; font-weight: 800; letter-spacing: 0.02em;
  margin-bottom: 16px; text-align: center; line-height: 1.4;
  color: var(--charcoal);
}
.home-brand .wait { color: var(--coral); }
.home-brand .mate { color: var(--coral); }
.home-tagline {
  font-size: 0.82rem; color: var(--stone); margin-bottom: 6px;
  text-align: center; line-height: 1.5;
}
.home-title {
  font-size: 1.6rem; font-weight: 800; color: var(--charcoal);
  margin-bottom: 8px; text-align: center; line-height: 1.3;
}
.home-title span { color: var(--coral); }
.home-subtitle {
  font-size: 0.78rem; color: var(--warm-gray); margin-bottom: 36px;
  text-align: center; line-height: 1.5;
}
.home-buttons { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 320px; }
.home-btn {
  display: flex; align-items: center; gap: 14px;
  padding: 22px 24px; border-radius: 16px; border: none; cursor: pointer;
  text-align: left; transition: transform 0.15s, box-shadow 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.home-btn:active { transform: scale(0.97); }
.home-btn-explore {
  background: linear-gradient(135deg, var(--coral), #D4694E);
  color: #fff; box-shadow: 0 4px 16px rgba(224,122,95,0.3);
}
.home-btn-recommend {
  background: var(--white); color: var(--charcoal);
  border: 1.5px solid #E8E0D8; box-shadow: 0 2px 8px rgba(41,37,36,0.06);
}
.home-btn-icon { font-size: 1.6rem; flex-shrink: 0; }
.home-btn-text { display: flex; flex-direction: column; }
.home-btn-title { font-size: 1rem; font-weight: 700; }
.home-btn-desc { font-size: 0.72rem; opacity: 0.8; margin-top: 2px; }

/* === SEARCH === */
.search-bar {
  background: var(--white); border-radius: 10px; padding: 10px 14px;
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
  border: 1px solid #E8E0D8;
}
.search-bar svg { width:18px; height:18px; color:var(--warm-gray); flex-shrink:0; }
.search-bar input {
  border: none; outline: none; background: none; flex: 1;
  font-size: 0.85rem; color: var(--charcoal);
}
.search-bar input::placeholder { color: var(--warm-gray); }

/* Empty search state */
.search-empty {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 60px 20px; text-align: center;
}
.search-empty-icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.5; }
.search-empty-title { font-size: 0.9rem; font-weight: 700; color: var(--charcoal); margin-bottom: 6px; }
.search-empty-desc { font-size: 0.75rem; color: var(--warm-gray); line-height: 1.5; }
.browse-all-btn {
  margin-top: 20px; padding: 12px 28px; border: none; border-radius: 12px;
  background: var(--charcoal); color: #fff; font-size: 0.85rem; font-weight: 700;
  cursor: pointer; transition: opacity 0.2s;
}
.browse-all-btn:active { opacity: 0.8; }

/* === ORG CARD === */
.org-card {
  background: var(--white); border-radius: 12px; padding: 14px 16px;
  box-shadow: 0 1px 4px rgba(41,37,36,0.06); margin-bottom: 10px;
  cursor: pointer; transition: box-shadow 0.2s;
  -webkit-tap-highlight-color: transparent;
}
.org-card:active { box-shadow: 0 1px 8px rgba(41,37,36,0.12); }
.org-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
.org-header-left { display:flex; align-items:flex-start; gap:10px; flex:1; min-width:0; }
.org-checkbox {
  width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid #D6D0C8;
  flex-shrink: 0; margin-top: 2px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; transition: all 0.15s;
  background: var(--white);
}
.org-checkbox.checked { background: var(--coral); border-color: var(--coral); }
.org-checkbox.checked::after { content:''; width:6px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); margin-top:-2px; }
.compare-toggle-btn {
  display:block; width:100%; padding:10px; margin-bottom:10px; border-radius:10px;
  border:1.5px solid #E8E0D8; background:var(--white); color:var(--stone);
  font-size:0.85rem; font-weight:600; cursor:pointer; transition:all 0.2s;
  text-align:center;
}
.compare-toggle-btn.active { background:var(--coral); color:#fff; border-color:var(--coral); }
.org-name-wrap { min-width:0; }
.org-name { font-size:0.9rem; font-weight:700; line-height:1.3; }
.org-type-badge {
  display:inline-block; font-size:0.6rem; color:var(--warm-gray);
  border:1px solid #E8E0D8; border-radius:4px; padding:1px 5px; margin-top:3px;
}
.org-link-btn {
  font-size:0.7rem; font-weight:600; color:#fff; background:linear-gradient(135deg, var(--coral), #D4694E);
  border:none; border-radius:20px; padding:5px 12px; cursor:pointer;
  white-space:nowrap; flex-shrink:0; margin-top:2px;
  -webkit-tap-highlight-color: transparent;
}
.metric-line { font-size:0.78rem; color:var(--stone); margin-bottom:6px; line-height:1.4; }
.metric-line strong { color:var(--coral); font-weight:700; }
.bar-bg { height:6px; border-radius:3px; background:#F0E6DC; margin-bottom:10px; }
.bar-fill { height:100%; border-radius:3px; background:linear-gradient(90deg, var(--coral), var(--sand)); transition:width 0.6s ease; }
.tags { display:flex; gap:4px; flex-wrap:wrap; }
.tag-cause { font-size:0.6rem; padding:2px 7px; border-radius:10px; background:#FDE8E0; color:var(--muted-red); font-weight:500; }
.tag-target { font-size:0.6rem; padding:2px 7px; border-radius:10px; background:#D4EDDA; color:#4A7C5B; font-weight:500; }
.tag-region { font-size:0.6rem; padding:2px 7px; border-radius:10px; background:#FEF3C7; color:#92400E; font-weight:500; }

/* === COMPARE FAB === */
.compare-fab-wrap {
  position:fixed; bottom:80px; left:50%; transform:translateX(-50%);
  display:none; z-index:100; align-items:center; gap:0;
}
.compare-fab {
  background:linear-gradient(135deg, var(--coral), #D4694E); color:#fff;
  border:none; border-radius:24px 0 0 24px; padding:12px 20px 12px 28px; font-size:0.85rem;
  font-weight:700; cursor:pointer; box-shadow:0 4px 16px rgba(224,122,95,0.4);
  -webkit-tap-highlight-color:transparent;
}
.compare-fab-close {
  background:#D4694E; color:rgba(255,255,255,0.9); border:none;
  border-radius:0 24px 24px 0; padding:12px 16px 12px 12px; font-size:0.9rem;
  font-weight:700; cursor:pointer; box-shadow:0 4px 16px rgba(224,122,95,0.4);
  border-left:1px solid rgba(255,255,255,0.2);
  -webkit-tap-highlight-color:transparent;
}

/* === RECOMMEND FUNNEL === */
.funnel-card {
  background:var(--white); border-radius:12px; padding:20px;
  box-shadow:0 1px 4px rgba(41,37,36,0.06); margin-bottom:10px;
}
.funnel-q { font-size:0.7rem; color:var(--coral); font-weight:600; margin-bottom:4px; }
.funnel-title { font-size:1.05rem; font-weight:700; margin-bottom:16px; }
.funnel-options { display:flex; flex-direction:column; gap:8px; }
.funnel-option {
  padding:12px 16px; border-radius:10px; border:1.5px solid #E8E0D8;
  background:var(--white); font-size:0.85rem; font-weight:500;
  cursor:pointer; transition:all 0.2s; text-align:left;
  -webkit-tap-highlight-color:transparent;
}
@media (hover:hover) { .funnel-option:hover { border-color:var(--coral); } }
.funnel-option:active { border-color:var(--coral); }
.funnel-option.selected { border-color:var(--coral); background:#FDE8E0; color:var(--muted-red); }
.funnel-chips { display:flex; gap:6px; flex-wrap:wrap; }
.funnel-chip {
  padding:8px 14px; border-radius:20px; border:1.5px solid #E8E0D8;
  background:var(--white); font-size:0.8rem; font-weight:500; cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.funnel-chip.selected { border-color:var(--coral); background:var(--coral); color:#fff; }
.funnel-next {
  display:block; width:100%; margin-top:16px; padding:14px; border-radius:10px;
  border:none; background:var(--coral); color:#fff; font-size:0.9rem; font-weight:700;
  cursor:pointer; transition:opacity 0.2s;
}
.funnel-next:disabled { opacity:0.35; cursor:default; }
.funnel-next:not(:disabled):active { opacity:0.85; }
.funnel-nav { display:flex; gap:10px; margin-top:16px; }
.funnel-prev {
  flex:1; padding:14px; border-radius:10px;
  border:1.5px solid #E8E0D8; background:var(--white); color:var(--stone);
  font-size:0.9rem; font-weight:700; cursor:pointer; transition:opacity 0.2s;
}
.funnel-prev:active { opacity:0.85; }
.funnel-nav .funnel-next { flex:2; margin-top:0; }
.funnel-option.selected { border-color:var(--coral); background:#FDE8E0; color:var(--muted-red); }
.funnel-results-header { margin-bottom:12px; }
.funnel-results-header h2 { font-size:1rem; font-weight:700; margin-bottom:4px; }
.result-rank {
  display:inline-flex; align-items:center; justify-content:center;
  width:24px; height:24px; border-radius:50%; font-size:0.7rem;
  font-weight:700; color:#fff; flex-shrink:0; margin-right:8px;
}
.rank-1 { background:var(--coral); }
.rank-2 { background:var(--sand); color:var(--charcoal); }
.rank-3, .rank-default { background:#D6D0C8; }
.reset-btn {
  display:block; margin:16px auto 8px; padding:10px 24px; border-radius:10px;
  border:1.5px solid #E8E0D8; background:var(--white); font-size:0.8rem;
  font-weight:600; color:var(--stone); cursor:pointer;
}
.context-disclaimer {
  font-size:0.7rem; color:var(--stone); line-height:1.5;
  background:var(--cream); padding:10px 12px; border-radius:8px;
  margin-top:12px; border-left:2px solid var(--sand);
}

/* === CALCULATOR (in detail) === */
.calc-toggle-btn {
  display:block; width:100%; padding:14px; border-radius:12px;
  border:1.5px solid var(--coral); background:var(--white);
  color:var(--coral); font-size:0.85rem; font-weight:700;
  cursor:pointer; margin-bottom:10px; text-align:center;
  transition:all 0.2s; -webkit-tap-highlight-color:transparent;
}
.calc-toggle-btn:active { background:var(--coral); color:#fff; }
.calc-detail-wrap {
  max-height:0; overflow:hidden; transition:max-height 0.35s ease;
}
.calc-detail-inner { padding:4px 0 16px; }
.calc-card {
  background:var(--white); border-radius:12px; padding:16px;
  box-shadow:0 1px 4px rgba(41,37,36,0.06); margin-bottom:12px;
}
.calc-label { font-size:0.78rem; font-weight:600; color:var(--stone); margin-bottom:6px; }
.calc-input {
  width:100%; padding:10px 12px; border:1.5px solid #E8E0D8; border-radius:10px;
  font-size:0.9rem; outline:none; background:var(--white); color:var(--charcoal);
  margin-bottom:12px;
}
.calc-input:focus { border-color:var(--coral); }
.result-card {
  background:var(--charcoal); border-radius:12px; padding:16px;
  color:#fff; margin-top:4px; margin-bottom:10px;
}
.result-main { text-align:center; padding:8px 0 12px; border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:12px; }
.result-label { font-size:0.7rem; color:var(--warm-gray); margin-bottom:4px; }
.result-value { font-size:1.8rem; font-weight:800; color:var(--sand); }
.result-value span { font-size:0.8rem; font-weight:400; }
.result-rows { }
.result-row { display:flex; justify-content:space-between; padding:4px 0; font-size:0.8rem; }
.result-row-label { color:var(--warm-gray); }
.result-row-value { font-weight:600; }

/* === DETAIL === */
.detail-back {
  display:inline-flex; align-items:center; gap:4px; font-size:0.8rem;
  color:var(--stone); font-weight:600; cursor:pointer; margin-bottom:12px;
  border:none; background:none; padding:4px 0;
}
.detail-header { margin-bottom:16px; }
.detail-header h1 { font-size:1.1rem; font-weight:800; line-height:1.3; }
.d-section {
  background:var(--white); border-radius:12px; padding:16px;
  box-shadow:0 1px 4px rgba(41,37,36,0.06); margin-bottom:12px;
}
.d-section-title {
  font-size:0.85rem; font-weight:700; color:var(--charcoal); margin-bottom:10px;
  display:flex; align-items:center; gap:6px;
}
.context-text {
  font-size:0.7rem; color:var(--stone); line-height:1.5;
  background:var(--cream); padding:8px 10px; border-radius:8px;
  margin-top:10px; border-left:2px solid var(--sand);
}
.donut-container { display:flex; align-items:center; gap:16px; margin:12px 0; }
.donut-svg { width:100px; height:100px; flex-shrink:0; }
.donut-legend { font-size:0.75rem; }
.legend-item { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
.legend-dot { width:8px; height:8px; border-radius:2px; flex-shrink:0; }
.d-metric { display:flex; justify-content:space-between; align-items:baseline; padding:7px 0; border-bottom:1px solid #F0E6DC; }
.d-metric:last-child { border-bottom:none; }
.d-metric-label { font-size:0.78rem; color:var(--stone); }
.d-metric-value { font-size:1rem; font-weight:800; color:var(--coral); }

/* Program accordion */
.program-item { border-bottom:1px solid #F0E6DC; }
.program-item:last-child { border-bottom:none; }
.program-bar-wrap { display:flex; align-items:center; gap:8px; margin-top:4px; }
.program-bar-bg { flex:1; height:6px; border-radius:3px; background:#F0E6DC; }
.program-bar-fg { height:100%; border-radius:3px; background:var(--coral); }
.program-pct { font-size:0.68rem; color:var(--stone); min-width:36px; text-align:right; }
.program-header {
  display:flex; justify-content:space-between; align-items:center;
  padding:10px 0; cursor:pointer; -webkit-tap-highlight-color:transparent;
}
.program-header-left { font-size:0.82rem; font-weight:600; flex:1; }
.program-cost { font-size:0.75rem; color:var(--coral); font-weight:700; margin-right:8px; }
.program-arrow { font-size:0.7rem; color:var(--warm-gray); transition:transform 0.2s; display:inline-block; }
.program-arrow.open { transform:rotate(90deg); }
.program-body { max-height:0; overflow:hidden; transition:max-height 0.3s ease; }
.program-body-inner { padding:0 0 12px; font-size:0.75rem; color:var(--stone); line-height:1.5; }
.program-body-inner .prog-chip { display:inline-block; background:#FDE8E0; color:var(--coral); font-size:0.68rem; font-weight:600; padding:3px 8px; border-radius:20px; margin:2px 3px 2px 0; }
.program-region { display:inline-block; font-size:0.65rem; color:var(--sage); background:#E8F5E9; padding:2px 8px; border-radius:20px; margin-top:8px; font-weight:600; }

/* Disclaimer section */
.disclaimer-card {
  background:var(--cream); border-radius:12px; padding:16px;
  border:1px solid #E8E0D8; margin-bottom:12px;
}
.disclaimer-card h3 { font-size:0.8rem; font-weight:700; color:var(--stone); margin-bottom:8px; }
.disclaimer-card p { font-size:0.73rem; color:var(--stone); line-height:1.6; }

/* Donation CTA */
.donate-cta {
  display:block; width:100%; padding:14px; border-radius:12px; border:none;
  background:linear-gradient(135deg, var(--coral), #D4694E); color:#fff;
  font-size:0.9rem; font-weight:700; text-align:center; cursor:pointer;
  text-decoration:none; margin-bottom:10px;
}
.donate-info {
  background:var(--white); border-radius:12px; padding:14px 16px;
  box-shadow:0 1px 4px rgba(41,37,36,0.06); margin-bottom:20px;
}
.donate-info-row { display:flex; justify-content:space-between; font-size:0.78rem; padding:4px 0; }
.donate-info-label { color:var(--stone); }
.donate-info-value { font-weight:600; }

/* Trend chart */
.chart-container { margin:12px 0; }
.chart-container svg { width:100%; }

/* Audit badge row */
.badge-row { display:flex; gap:8px; margin:8px 0; }
.badge {
  flex:1; text-align:center; padding:10px 8px; border-radius:10px;
  background:#FAF5F0;
}
.badge-year { font-size:0.65rem; color:var(--warm-gray); margin-bottom:2px; }
.badge-opinion { font-size:0.75rem; font-weight:700; }
.badge-opinion.good { color:var(--sage); }

/* Toggle detail panels (expense breakdown) */
.detail-panel { max-height:0; overflow:hidden; transition:max-height 0.25s ease; }
.detail-panel.detail-open { max-height:300px; }
.toggle-arrow { display:inline-block; transition:transform 0.2s; }
.toggle-arrow.arrow-open { transform:rotate(90deg); }

/* === COMPARE === */
.compare-grid { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.compare-section-header { padding:6px 12px; background:#FAF5F0; font-size:0.7rem; font-weight:700; color:var(--stone); }
.compare-data-row { display:grid; border-bottom:1px solid #F0E6DC; }
.compare-data-row > div { padding:8px; }
.compare-data-row > div:first-child { font-size:0.72rem; color:var(--stone); }
.compare-data-row > div:not(:first-child) { text-align:center; font-size:0.8rem; font-weight:600; }
.compare-actions { display:flex; gap:10px; margin-top:16px; }
.compare-actions button {
  flex:1; padding:12px; border-radius:10px; font-size:0.82rem; font-weight:600; cursor:pointer;
}
.btn-outline { border:1.5px solid #E8E0D8; background:var(--white); color:var(--stone); }
.btn-coral { border:none; background:linear-gradient(135deg, var(--coral), #D4694E); color:#fff; }

/* Revenue bar (horizontal) */
.rev-bar-wrap { display:flex; align-items:center; gap:6px; margin:3px 0; }
.rev-bar-label { font-size:0.68rem; color:var(--stone); width:50px; text-align:right; flex-shrink:0; }
.rev-bar-track { flex:1; height:10px; background:#F0E6DC; border-radius:5px; overflow:hidden; }
.rev-bar-fill { height:100%; border-radius:5px; }

/* 3-year table */
.year-table { width:100%; font-size:0.75rem; border-collapse:collapse; margin:8px 0; }
.year-table th { font-weight:600; color:var(--warm-gray); text-align:center; padding:4px 6px; border-bottom:1px solid #E8E0D8; }
.year-table td { text-align:center; padding:6px; font-weight:600; }

/* Asset health indicator */
.asset-health-row { display:flex; justify-content:space-between; align-items:center; padding:6px 0; }
.asset-health-label { font-size:0.75rem; color:var(--stone); }
.asset-health-value { font-size:0.85rem; font-weight:700; }
.asset-health-good { color: #4A7C5B; }
.asset-health-warn { color: #92400E; }
.asset-health-bar { height:8px; border-radius:4px; background:#F0E6DC; margin:6px 0 4px; }
.asset-health-fill { height:100%; border-radius:4px; background:linear-gradient(90deg, var(--sage), #4A7C5B); }
</style>
</head>
<body>
<div class="app-shell">
  <div class="top-bar"><div class="logo"></div></div>
  <div class="content-area" id="contentArea">

    <!-- HOME -->
    <div class="screen active" id="screenHome">
      <div class="home-container">
        <div class="home-brand">Don't <span class="wait">Wait</span>, Do, <span class="mate">Mate</span></div>

        <div class="home-subtitle">홈택스 공시 데이터 기반으로<br>공익법인을 비교하고 추천받아요</div>
        <div class="home-buttons">

          <button class="home-btn home-btn-recommend" onclick="switchTab('recommend')">

        <input type="text" id="searchInput" placeholder="단체 이름을 검색해 보세요 (초성 검색 가능)">

        <div class="search-empty-icon">🏛️</div>
        <div class="search-empty-title">27개 공익법인 검색</div>
        <div class="search-empty-desc">이름이나 초성으로 검색하면<br>실시간으로 결과를 보여줘요</div>
      </div>
      <div id="orgList"></div>
    </div>

    <!-- RECOMMEND -->
    <div class="screen" id="screenRecommend">
      <div id="funnelContainer"></div>
    </div>

    <!-- DETAIL -->
    <div class="screen" id="screenDetail"></div>

    <!-- COMPARE -->
    <div class="screen" id="screenCompare"></div>
  </div>

  <!-- Compare FAB with X button -->
  <div class="compare-fab-wrap" id="compareFabWrap">
    <button class="compare-fab" id="compareFab" onclick="showCompare()"></button>
    <button class="compare-fab-close" onclick="clearAllSelections()">✕</button>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <button class="bottom-tab active" data-tab="home" onclick="switchTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1"/></svg>
      홈
    </button>
    <button class="bottom-tab" data-tab="explore" onclick="switchTab('explore')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      둘러보기
    </button>
    <button class="bottom-tab" data-tab="recommend" onclick="switchTab('recommend')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
      추천
    </button>
  </div>
</div>
<script src="data.js"></script>
<script>
// ===== DATA =====
// DATA loaded from data.js


// ===== CURRENT RATIO DATA (유동자산/유동부채) =====
// CURRENT_RATIO_DATA loaded from data.js
function getCurrentRatio(orgId) {
  const id = (orgId === 'NP0003' || orgId === 'NP0004') ? 'NP0003_0004' : orgId;
  const d = CURRENT_RATIO_DATA[id] || CURRENT_RATIO_DATA[orgId];
  if (!d) return null;
  const yrs = {};
  let latestRatio = null, latestFy = null;
  for (const fy of ['2025','2024','2023']) {
    if (d[fy] && d[fy].cl > 0) {
      const r = d[fy].ca / d[fy].cl * 100;
      yrs[fy] = { assets: d[fy].ca, liabilities: d[fy].cl, ratio: r };
      if (!latestRatio) { latestRatio = r; latestFy = fy; }
    } else {
      yrs[fy] = null;
    }
  }
  if (!latestRatio) return null;
  return { ratio: latestRatio, fy: latestFy, years: yrs };
}

// ===== HELPERS =====
function fmt(n) {
  if (n == null) return '-';
  return n.toLocaleString('ko-KR');
}
function fmtEok(n) {
  if (n == null) return '-';
  const eok = n / 100000000;
  if (eok >= 1) return eok.toFixed(1) + '억원';
  const man = n / 10000;
  return Math.round(man).toLocaleString('ko-KR') + '만원';
}
function fmtWon(n) {
  if (n == null) return '-';
  return n.toLocaleString('ko-KR') + '원';
}
function getLatestFY(org) {
  return org.fiscal_years['2026'] || org.fiscal_years['2025'] || org.fiscal_years['2024'] || org.fiscal_years['2023'];
}
function getExpenseRatios(fy) {
  const t = fy.expense_breakdown_ui['사업비'] + fy.expense_breakdown_ui['운영비'] + fy.expense_breakdown_ui['모금비'];
  return {
    사업비: fy.expense_breakdown_ui['사업비'] / t,
    운영비: fy.expense_breakdown_ui['운영비'] / t,
    모금비: fy.expense_breakdown_ui['모금비'] / t,
    total: t
  };
}
function getDonTypeBadge(dt) {
  return dt === '특례기부금' ? '특례기부금' : '지정기부금';
}
function matchRegion(orgRegion, filterRegion) {
  if (filterRegion === '국내') return orgRegion === '국내' || orgRegion === '국내외';
  if (filterRegion === '해외') return orgRegion === '해외' || orgRegion === '국내외';
  return true;
}
function matchTarget(orgTargets, filterTarget) {
  return orgTargets.includes('전체') || orgTargets.includes(filterTarget);
}

// ===== KOREAN CHOSUNG SEARCH =====
const CHOSUNG_LIST = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function getChosung(str) {
  let result = '';
  for (let i = 0; i < str.length; i++) {
    const code = str.charCodeAt(i) - 0xAC00;
    if (code >= 0 && code <= 11171) {
      result += CHOSUNG_LIST[Math.floor(code / 588)];
    }
  }
  return result;
}
function isChosung(ch) {
  return CHOSUNG_LIST.includes(ch) || 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'.includes(ch);
}
function matchSearch(name, query) {
  const q = query.trim().toLowerCase();
  if (!q) return 0;
  // Direct substring match (highest priority)
  if (name.toLowerCase().includes(q)) return 2;
  // Chosung match
  const allChosung = q.split('').every(c => isChosung(c));
  if (allChosung) {
    const nameChosung = getChosung(name);
    if (nameChosung.includes(q)) return 1;
  }
  return 0;
}

// ===== STATE =====
let currentTab = 'home';
let selectedOrgs = new Set();
let compareMode = false;
let funnelState = { step: 1, regions: [], targets: [], causes: [], budget: null };

// ===== TAB SWITCHING =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.bottom-tab').forEach(t => t.classList.remove('active'));
  const screenMap = { home: 'screenHome', explore: 'screenExplore', recommend: 'screenRecommend' };
  if (screenMap[tab]) {
    document.getElementById(screenMap[tab]).classList.add('active');
    const tabBtn = document.querySelector(`[data-tab="${tab}"]`);
    if (tabBtn) tabBtn.classList.add('active');
  }
  document.getElementById('contentArea').scrollTop = 0;
  if (tab === 'recommend' && funnelState.step === 1) renderFunnel();
  if (tab === 'explore') {
    const input = document.getElementById('searchInput');
    if (input.value.trim()) {
      renderOrgList(input.value);
    } else {
      showAllOrgList();
    }
  }
}

// ===== EXPLORE =====
function renderOrgList(filter = '') {
  showingAllOrgs = false;
  const container = document.getElementById('orgList');
  const emptyState = document.getElementById('searchEmpty');
  const q = filter.trim();
  if (!q) {
    showAllOrgList();
    return;
    container.innerHTML = '';
    emptyState.style.display = 'flex';
    return;
  }
  emptyState.style.display = 'none';
  // Score and sort by match quality
  let results = DATA.orgs.map(org => {
    const score = matchSearch(org.name, q);
    return { org, score };
  }).filter(r => r.score > 0).sort((a, b) => b.score - a.score);

  if (results.length === 0) {
    container.innerHTML = `<div class="search-empty">
      <div class="search-empty-icon">😥</div>
      <div class="search-empty-title">검색 결과가 없어요</div>
      <div class="search-empty-desc">다른 이름이나 초성으로 검색해 보세요</div>
    </div>`;
    return;
  }

  let html = '';
  results.forEach(r => {
    const org = r.org;
    const fy = getLatestFY(org);
    const ratios = getExpenseRatios(fy);
    const perTenK = Math.round(ratios['사업비'] * 10000);
    const checked = selectedOrgs.has(org.id);
    const causes = org.cause.filter(c => c !== '모금·배분플랫폼').slice(0, 2);
    const targets = org.target.slice(0, 1);
    html += `
    <div class="org-card" id="card-${org.id}">
      <div class="org-header">
        <div class="org-header-left">
          ${compareMode ? `<div class="org-checkbox ${checked ? 'checked' : ''}" onclick="event.stopPropagation();toggleSelect('${org.id}')"></div>` : ''}
          <div class="org-name-wrap" onclick="showDetail('${org.id}')">
            <div class="org-name">${org.name}</div>
            <div class="org-type-badge">${getDonTypeBadge(org.donation_type)}</div>
          </div>
        </div>
        <button class="org-link-btn" onclick="event.stopPropagation();showDetail('${org.id}')">보러가기 &rarr;</button>
      </div>
      <div onclick="showDetail('${org.id}')">
        <div class="metric-line">후원금 1만원 기준, 약 <strong>${fmt(perTenK)}원</strong>이 사업에 쓰여요</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${(ratios['사업비']*100).toFixed(1)}%"></div></div>
        <div class="tags">
          ${causes.map(c => `<span class="tag-cause">${c}</span>`).join('')}
          ${targets.map(t => `<span class="tag-target">${t}</span>`).join('')}
          <span class="tag-region">${org.region}</span>
        </div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
  updateFab();
}

let showingAllOrgs = false;
function toggleSelect(id) {
  if (selectedOrgs.has(id)) selectedOrgs.delete(id);
  else if (selectedOrgs.size < 3) selectedOrgs.add(id);
  if (showingAllOrgs) showAllOrgList();
  else renderOrgList(document.getElementById('searchInput').value);
}

function updateFab() {
  const wrap = document.getElementById('compareFabWrap');
  const fab = document.getElementById('compareFab');
  if (selectedOrgs.size >= 2) {
    wrap.style.display = 'flex';
    fab.textContent = `비교하기 (${selectedOrgs.size})`;
  } else {
    wrap.style.display = 'none';
  }
}

function clearAllSelections() {
  selectedOrgs.clear();
  compareMode = false;
  const btn = document.getElementById('compareToggleBtn');
  if (btn) { btn.classList.remove('active'); btn.textContent = '☐ 비교하기'; }
  const input = document.getElementById('searchInput');
  if (input.value.trim()) {
    renderOrgList(input.value);
  }
  updateFab();
}

function toggleCompareMode() {
  compareMode = !compareMode;
  const btn = document.getElementById('compareToggleBtn');
  if (compareMode) { btn.classList.add('active'); btn.textContent = '☑ 비교하기'; }
  else { btn.classList.remove('active'); btn.textContent = '☐ 비교하기'; selectedOrgs.clear(); updateFab(); }
  const input = document.getElementById('searchInput');
  if (input.value.trim()) renderOrgList(input.value);
  else if (showingAllOrgs) showAllOrgList();
}

function showAllOrgList() {
  showingAllOrgs = true;
  const container = document.getElementById('orgList');
  const emptyState = document.getElementById('searchEmpty');
  emptyState.style.display = 'none';
  // Sort by expense ratio (사업비 비율) descending
  let sorted = DATA.orgs.slice().sort((a, b) => {
    const ra = getExpenseRatios(getLatestFY(a))['사업비'] || 0;
    const rb = getExpenseRatios(getLatestFY(b))['사업비'] || 0;
    return rb - ra;
  });
  let html = '<div style="padding:8px 0 12px;"><div style="font-size:0.85rem;font-weight:700;color:var(--charcoal);">전체 공익법인 (${count}개)</div><div style="font-size:0.7rem;color:var(--warm-gray);margin-top:2px;">사업비 비율 높은 순</div></div>'.replace('${count}', sorted.length);
  sorted.forEach(org => {
    const fy = getLatestFY(org);
    const ratios = getExpenseRatios(fy);
    const perTenK = Math.round(ratios['사업비'] * 10000);
    const checked = selectedOrgs.has(org.id);
    const causes = org.cause.filter(c => c !== '모금·배분플랫폼').slice(0, 2);
    const targets = org.target.slice(0, 1);
    html += `
    <div class="org-card" id="card-${org.id}">
      <div class="org-header">
        <div class="org-header-left">
          ${compareMode ? `<div class="org-checkbox ${checked ? 'checked' : ''}" onclick="event.stopPropagation();toggleSelect('${org.id}')"></div>` : ''}
          <div class="org-name-wrap" onclick="showDetail('${org.id}')">
            <div class="org-name">${org.name}</div>
            <div class="org-type-badge">${getDonTypeBadge(org.donation_type)}</div>
          </div>
        </div>
        <button class="org-link-btn" onclick="event.stopPropagation();showDetail('${org.id}')">보러가기 &rarr;</button>
      </div>
      <div onclick="showDetail('${org.id}')">
        <div class="metric-line">후원금 1만원 기준, 약 <strong>${fmt(perTenK)}원</strong>이 사업에 쓰여요</div>
        <div class="bar-bg"><div class="bar-fill" style="width:${(ratios['사업비']*100).toFixed(1)}%"></div></div>
        <div class="tags">
          ${causes.map(c => `<span class="tag-cause">${c}</span>`).join('')}
          ${targets.map(t => `<span class="tag-target">${t}</span>`).join('')}
          <span class="tag-region">${org.region}</span>
        </div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
  updateFab();
}

// ===== SEARCH =====
document.getElementById('searchInput').addEventListener('input', e => {
  renderOrgList(e.target.value);
});

// ===== RECOMMEND FUNNEL =====
const BUDGET_OPTIONS = [
  { label: '월 1만원 이하', max: 10000 },
  { label: '월 1~3만원', max: 30000 },
  { label: '월 3~5만원', max: 50000 },
  { label: '월 5만원 이상', max: Infinity },
  { label: '상관없어요', max: null }
];

function renderFunnel() {
  const container = document.getElementById('funnelContainer');
  if (funnelState.step === 1) {
    container.innerHTML = `
      <div class="funnel-card">
        <div class="funnel-q">Q1 / 4</div>
        <div class="funnel-title">어떤 지역의 단체를 찾고 있어요?</div>
        <div class="funnel-options">
          ${DATA.filter_layers.layer1_region.map(r => `<div class="funnel-option ${funnelState.regions.includes(r)?'selected':''}" onclick="funnelToggle('regions','${r}')">${r}</div>`).join('')}
        </div>
        <button class="funnel-next" ${funnelState.regions.length===0?'disabled':''} onclick="funnelNext()">다음</button>
      </div>`;
  } else if (funnelState.step === 2) {
    const pool = DATA.orgs.filter(o => funnelMatchRegions(o));
    const availTargets = new Set();
    pool.forEach(o => o.target.forEach(t => availTargets.add(t)));
    const targets = DATA.filter_layers.layer2_target.filter(t => availTargets.has(t));
    container.innerHTML = `
      <div class="funnel-card">
        <div class="funnel-q">Q2 / 4</div>
        <div class="funnel-title">어떤 대상을 돕고 싶어요?</div>
        <div class="funnel-chips">
          ${targets.map(t => `<div class="funnel-chip ${funnelState.targets.includes(t)?'selected':''}" onclick="funnelToggle('targets','${t}')">${t}</div>`).join('')}
        </div>
        <div class="funnel-nav"><button class="funnel-prev" onclick="funnelPrev()">이전</button><button class="funnel-next" ${funnelState.targets.length===0?'disabled':''} onclick="funnelNext()">다음</button></div>
      </div>`;
  } else if (funnelState.step === 3) {
    const pool = DATA.orgs.filter(o => funnelMatchRegions(o) && funnelMatchTargets(o));
    const availCauses = new Set();
    pool.forEach(o => o.cause.forEach(c => { if (c !== '모금·배분플랫폼') availCauses.add(c); }));
    const causes = DATA.filter_layers.layer3_cause.filter(c => availCauses.has(c));
    container.innerHTML = `
      <div class="funnel-card">
        <div class="funnel-q">Q3 / 4</div>
        <div class="funnel-title">어떤 분야에 관심이 있어요?</div>
        <div class="funnel-options">
          ${causes.map(c => `<div class="funnel-option ${funnelState.causes.includes(c)?'selected':''}" onclick="funnelToggle('causes','${c}')">${c}</div>`).join('')}
        </div>
        <div class="funnel-nav"><button class="funnel-prev" onclick="funnelPrev()">이전</button><button class="funnel-next" ${funnelState.causes.length===0?'disabled':''} onclick="funnelNext()">다음</button></div>
      </div>`;
  } else if (funnelState.step === 4) {
    container.innerHTML = `
      <div class="funnel-card">
        <div class="funnel-q">Q4 / 4</div>
        <div class="funnel-title">후원하고 싶은 금액대가 있어요?</div>
        <div class="funnel-options">
          ${BUDGET_OPTIONS.map((b,i) => `<div class="funnel-option ${funnelState.budget===i?'selected':''}" onclick="funnelPickBudget(${i})">${b.label}</div>`).join('')}
        </div>
        <div class="funnel-nav"><button class="funnel-prev" onclick="funnelPrev()">이전</button><button class="funnel-next" ${funnelState.budget===null?'disabled':''} onclick="funnelNext()">결과 보기</button></div>
      </div>`;
  } else {
    renderFunnelResults();
  }
}

function funnelToggle(field, val) {
  const arr = funnelState[field];
  const idx = arr.indexOf(val);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(val);
  renderFunnel();
}

function funnelPickBudget(idx) {
  funnelState.budget = funnelState.budget === idx ? null : idx;
  renderFunnel();
}

function funnelNext() {
  funnelState.step++;
  renderFunnel();
}

function funnelPrev() {
  if (funnelState.step > 1) { funnelState.step--; renderFunnel(); }
}

function funnelMatchRegions(org) {
  if (funnelState.regions.length === 0) return true;
  return funnelState.regions.some(r => matchRegion(org.region, r));
}

function funnelMatchTargets(org) {
  if (funnelState.targets.length === 0) return true;
  return funnelState.targets.some(t => matchTarget(org.target, t));
}

function funnelMatchCauses(org) {
  if (funnelState.causes.length === 0) return true;
  return funnelState.causes.some(c => org.cause.includes(c));
}

function funnelMatchBudget(org) {
  if (funnelState.budget === null) return true;
  const opt = BUDGET_OPTIONS[funnelState.budget];
  if (opt.max === null) return true; // 상관없어요
  if (!org.recurring_min) return true; // 데이터 없으면 포함
  if (opt.max === Infinity) return org.recurring_min >= 50000;
  return org.recurring_min <= opt.max;
}

function renderFunnelResults() {
  const container = document.getElementById('funnelContainer');
  let results = DATA.orgs.filter(o => funnelMatchRegions(o) && funnelMatchBudget(o));
  results = results.map(o => {
    let score = 0;
    if (funnelMatchTargets(o)) score += 1;
    if (funnelMatchCauses(o)) score += 1;
    return { org: o, score };
  }).filter(r => r.score > 0).sort((a, b) => b.score - a.score);

  const summaryParts = [
    funnelState.regions.join('·'),
    funnelState.targets.join('·'),
    funnelState.causes.join('·'),
    funnelState.budget !== null ? BUDGET_OPTIONS[funnelState.budget].label : ''
  ].filter(Boolean).join(' · ');

  let html = `
    <div class="funnel-results-header">
      <h2>${summaryParts}</h2>
      <div style="font-size:0.78rem;color:var(--stone);">${results.length}개 단체를 찾았어요</div>
    </div>`;

  results.forEach((r, i) => {
    const org = r.org;

function resetFunnel() {

// ===== CALCULATOR (in detail page) =====
function calcInDetail(orgId) {
  const salaryRaw = document.getElementById('detailCalcSalary').value.replace(/[^0-9]/g, '');
  const donRaw = document.getElementById('detailCalcDonation').value.replace(/[^0-9]/g, '');
  const salary = Number(salaryRaw) || 0;
  const monthlyDon = Number(donRaw) || 0;
  const annualDon = monthlyDon * 12;
  if (!salary || !monthlyDon) {
    document.getElementById('detailCalcResult').innerHTML = '';
    return;
  }
  const org = DATA.orgs.find(o => o.id === orgId);
  const donType = org.donation_type;
  const donTypeLabel = donType === '특례기부금' ? '특례기부금' : '지정기부금';
  let deductibleLimit = donType === '특례기부금' ? salary : salary * 0.3;
  const deductible = Math.min(annualDon, deductibleLimit);
  let credit = 0;
  if (deductible <= 10000000) {
    credit = deductible * 0.15;
  } else {
    credit = 10000000 * 0.15 + (deductible - 10000000) * 0.3;
  }
  credit = Math.round(credit);
  const realCost = annualDon - credit;

  const burdenRate = annualDon > 0 ? (realCost / annualDon * 100).toFixed(1) : '0.0';
  document.getElementById('detailCalcResult').innerHTML = `
    <div class="result-card">
      <div class="result-main">
        <div class="result-label">연간 세액공제 추정액</div>
        <div class="result-value">${fmtWon(credit).replace('원','')}<span>원</span></div>
      </div>
      <div class="result-rows">
        <div class="result-row"><span class="result-row-label">월 후원금 × 12개월</span><span class="result-row-value">${fmtWon(monthlyDon)} × 12 = ${fmtWon(annualDon)}</span></div>
        <div class="result-row"><span class="result-row-label">공제 한도 (${donTypeLabel})</span><span class="result-row-value">${fmtWon(deductibleLimit)}</span></div>
        <div class="result-row"><span class="result-row-label">연간 실질 부담액</span><span class="result-row-value" style="color:var(--sand);">${fmtWon(realCost)}</span></div>
        <div class="result-row"><span class="result-row-label">월 실질 부담</span><span class="result-row-value" style="color:var(--sand);">약 ${fmtWon(Math.round(realCost/12))}/월</span></div>
      </div>
    </div>`;
  // 결과 추가 후 wrap maxHeight 갱신
  const wrap = document.getElementById('calcDetailWrap');
  if (wrap && wrap.style.maxHeight && wrap.style.maxHeight !== '0px') {
    wrap.style.maxHeight = wrap.scrollHeight + 'px';
  }
}

function toggleCalcDetail() {
  const wrap = document.getElementById('calcDetailWrap');
  if (wrap.style.maxHeight && wrap.style.maxHeight !== '0px') {
    wrap.style.maxHeight = '0px';
  } else {
    wrap.style.maxHeight = wrap.scrollHeight + 'px';
  }
}

function formatCalcInput(el) {
  const raw = el.value.replace(/[^0-9]/g, '');
  el.value = raw ? Number(raw).toLocaleString('ko-KR') : '';
}

function goBack() {

function highlightKeywords(text) {
  return text.replace(/\[([^\]]+)\]/g, (_, m) => `<strong style="color:var(--coral);font-weight:700;">[${m}]</strong>`);
}
function formatProgramContent(text) {
  if (!text || !text.trim()) return '<span style="color:var(--warm-gray);">세부 내용 없음</span>';
  let s = text.trim();
  let parts = s.split(/\n|(?<=\))\s*,\s*|(?:^|\n)\s*(?:\d+[\.\)]\s*|[-·*○●]\s*)/g).map(p => p.trim()).filter(Boolean);
  if (parts.length <= 1) {
    const chips = s.split(/[,，]\s*/).map(c => c.trim()).filter(c => c.length > 1 && c.length < 40);
    if (chips.length >= 3) {
      return '<div style="margin-top:2px;">' + chips.map(c => `<span class="prog-chip">${highlightKeywords(c)}</span>`).join('') + '</div>';
    }
    return `<div style="margin-top:2px;word-break:keep-all;">${highlightKeywords(s)}</div>`;
  }
  return '<ul style="margin:4px 0 0;padding-left:16px;">' + parts.slice(0, 8).map(p => {
    return `<li style="margin-bottom:3px;word-break:keep-all;">${highlightKeywords(p)}</li>`;
  }).join('') + (parts.length > 8 ? '<li style="color:var(--warm-gray);">외 ' + (parts.length - 8) + '건</li>' : '') + '</ul>';
}
function toggleProgram(el) {
  const body = el.parentElement.querySelector('.program-body');
  const arrow = el.querySelector('.program-arrow');
  if (body.style.maxHeight && body.style.maxHeight !== '0px') {
    body.style.maxHeight = '0px';
    arrow.classList.remove('open');
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    arrow.classList.add('open');
  }
}

// ===== SVG CHARTS =====
function makeDonut(data) {
  const cx = 50, cy = 50, r = 38, r2 = 22;
  let startAngle = -Math.PI / 2;
  let paths = '';
  data.forEach(d => {
    const angle = d.pct * 2 * Math.PI;
    const endAngle = startAngle + angle;
    const largeArc = angle > Math.PI ? 1 : 0;
    const x1 = cx + r * Math.cos(startAngle), y1 = cy + r * Math.sin(startAngle);
    const x2 = cx + r * Math.cos(endAngle), y2 = cy + r * Math.sin(endAngle);
    const x3 = cx + r2 * Math.cos(endAngle), y3 = cy + r2 * Math.sin(endAngle);
    const x4 = cx + r2 * Math.cos(startAngle), y4 = cy + r2 * Math.sin(startAngle);
    paths += `<path d="M${x1},${y1} A${r},${r} 0 ${largeArc} 1 ${x2},${y2} L${x3},${y3} A${r2},${r2} 0 ${largeArc} 0 ${x4},${y4} Z" fill="${d.color}"/>`;
    startAngle = endAngle;
  });
  return `<svg class="donut-svg" viewBox="0 0 100 100">${paths}</svg>`;
}

function makeTrendChart(years, revenues, expenses) {
  const W = 300, H = 140, padL = 55, padR = 15, padT = 15, padB = 30;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const allVals = [...revenues, ...expenses].filter(v => v != null);
  if (allVals.length === 0) return '<div style="font-size:0.75rem;color:var(--warm-gray);">데이터 없음</div>';
  let minV = Math.min(...allVals) * 0.9;
  let maxV = Math.max(...allVals) * 1.05;
  if (minV === maxV) { minV *= 0.9; maxV *= 1.1; }
  const scaleX = i => padL + (i / (years.length - 1)) * chartW;
  const scaleY = v => padT + chartH - ((v - minV) / (maxV - minV)) * chartH;

  function polyline(vals, color, dashed) {
    const pts = vals.map((v, i) => v != null ? `${scaleX(i)},${scaleY(v)}` : null).filter(Boolean);
    if (pts.length < 2) return '';
    return `<polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="2" ${dashed ? 'stroke-dasharray="5,3"' : ''}/>
      ${vals.map((v, i) => v != null ? `<circle cx="${scaleX(i)}" cy="${scaleY(v)}" r="3" fill="${color}"/>` : '').join('')}`;
  }

  function areaPath(vals, color) {
    const pts = vals.map((v, i) => v != null ? [scaleX(i), scaleY(v)] : null).filter(Boolean);
    if (pts.length < 2) return '';
    let d = `M${pts[0][0]},${padT + chartH}`;
    pts.forEach(p => d += ` L${p[0]},${p[1]}`);
    d += ` L${pts[pts.length-1][0]},${padT + chartH} Z`;
    return `<path d="${d}" fill="${color}" opacity="0.1"/>`;
  }

  const nTicks = 4;
  let gridLines = '';
  for (let i = 0; i <= nTicks; i++) {
    const v = minV + (maxV - minV) * (i / nTicks);
    const y = scaleY(v);
    gridLines += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="#E8E0D8" stroke-width="0.5"/>
      <text x="${padL-6}" y="${y+4}" text-anchor="end" fill="#A8A29E" font-size="8">${fmtEok(v)}</text>`;
  }

  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="font-family:Pretendard Variable,sans-serif">
    ${gridLines}
    ${areaPath(revenues, '#E07A5F')}
    ${areaPath(expenses, '#81B29A')}
    ${polyline(revenues, '#E07A5F', false)}
    ${polyline(expenses, '#81B29A', false)}
    ${years.map((y, i) => `<text x="${scaleX(i)}" y="${H-6}" text-anchor="middle" fill="#A8A29E" font-size="9">${y}</text>`).join('')}
    <circle cx="${W-padR-40}" cy="${padT}" r="3" fill="#E07A5F"/><text x="${W-padR-34}" y="${padT+3}" fill="#A8A29E" font-size="8">수입</text>
    <circle cx="${W-padR-40}" cy="${padT+12}" r="3" fill="#81B29A"/><text x="${W-padR-34}" y="${padT+15}" fill="#A8A29E" font-size="8">비용</text>
  </svg>`;
  return svg;
}

  return abbrs[name] || name.slice(0,2);
}
